name: Weekly Events Scraper

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scraper.js

      - name: Format events to Shenia format
        run: node format-events.js

      - name: Commit and push updated events
        run: |
          git config --local user.email "action@github.com"
          git pull --rebase origin main || true
          git config --local user.name "GitHub Actions"
          git add data/events.json data/events_raw.json
          git diff --staged --quiet || git commit -m "Weekly events update - $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
